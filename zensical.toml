# Docs site configuration for Zensical (https://zensical.org/docs/).
#   make docs        # build into site/
#   make docs-serve  # live preview at http://localhost:8000
# Zensical reads the same layout as MkDocs: pages live under docs/.

[project]
site_name = "pcode"
site_description = "A streaming terminal for a Pydantic AI Coder agent"
site_url = "https://cruxwell.github.io/pcode/"
repo_url = "https://github.com/cruxwell/pcode"
repo_name = "cruxwell/pcode"
edit_uri = "edit/master/docs/"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Overview" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guide" = [
    { "Scrollback and transparency" = "guide/scrollback.md" },
    { "A shell for long-running work" = "guide/shell.md" },
    { "Parallel agents" = "guide/parallel.md" },
    { "Extending pcode" = "guide/extending.md" },
  ] },
  { "Reference" = [
    { "Providers and models" = "providers.md" },
    { "Configuration" = "configuration.md" },
    { "Commands and keys" = "commands.md" },
    { "Keybindings" = "keybindings.md" },
    { "Tools" = "tools.md" },
    { "MCP servers" = "mcp.md" },
    { "Working in a repository" = "workspace.md" },
    { "Sessions and recovery" = "sessions.md" },
    { "Email remote control" = "email.md" },
    { "Conversation tree" = "conversation-tree.md" },
    { "Side questions" = "side-questions.md" },
    { "Context, limits and caching" = "context.md" },
    { "The transcript" = "transcript.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Deliberately conservative: the pymdownx caret/tilde/mark/smartsymbols
# extensions rewrite bare `~`, `^`, `==` and `(c)` in prose, and these pages are
# full of paths and key names.
[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.pygments_lang_class = true
pymdownx.magiclink = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
