# Docs site configuration for Zensical (https://zensical.org/docs/).
#   make docs        # build into site/
#   make docs-serve  # live preview at http://localhost:8000
# Zensical reads the same layout as MkDocs: pages live under docs/.

[project]
site_name = "pcode"
site_description = "A streaming terminal for a Pydantic AI Coder agent"
site_url = "https://aweis89.github.io/pcode/"
repo_url = "https://github.com/aweis89/pcode"
repo_name = "aweis89/pcode"
edit_uri = "edit/master/docs/"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Overview" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Providers and models" = "providers.md" },
  { "Configuration" = "configuration.md" },
  { "Commands and keys" = "commands.md" },
  { "Tools" = "tools.md" },
  { "MCP servers" = "mcp.md" },
  { "Working in a repository" = "workspace.md" },
  { "Sessions and recovery" = "sessions.md" },
  { "Background sessions" = "background-sessions.md" },
  { "Context, limits and caching" = "context.md" },
  { "Side questions" = "side-questions.md" },
  { "The transcript" = "transcript.md" },
  { "Internals" = [
    { "Development" = "development.md" },
    { "Prompt caching and plan reminders" = "prompt-caching.md" },
    { "Conversation tree" = "conversation-tree.md" },
    { "Background sessions plan" = "background-sessions-plan.md" },
    { "Profiling" = "profiling.md" },
    { "Dependencies" = "dependencies.md" },
    { "Anthropic provider options" = "anthropic-providers.md" },
    { "Meridian validation" = "meridian-validation.md" },
    { "Resize experiment" = "resize-experiment.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Deliberately conservative: the pymdownx caret/tilde/mark/smartsymbols
# extensions rewrite bare `~`, `^`, `==` and `(c)` in prose, and these pages are
# full of paths and key names.
[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.pygments_lang_class = true
pymdownx.magiclink = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
