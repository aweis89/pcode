name: publish

# Pushing a tag like v0.1.0 is the whole release: the package version comes
# from the tag (hatch-vcs), the sdist and wheel go to PyPI through trusted
# publishing (no API token in the repo), a GitHub Release is created, and
# Formula/pcode.rb is pointed at the release's source tarball on master. The PyPI project
# lists this repo, this workflow file and the `pypi` environment as a trusted
# publisher.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # hatch-vcs reads the version from the tag, so it needs tag history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - name: Check the built version matches the tag
        run: |
          ls dist/
          test -f "dist/pcode-${GITHUB_REF_NAME#v}.tar.gz" || {
            echo "built version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      # Homebrew's source: the tag's tree, uv.lock included (the sdist leaves it
      # out). Served as a release asset rather than GitHub's archive/refs/tags
      # URL because only assets keep a download count, which is how brew
      # installs are measured. Kept out of dist/, which goes to PyPI whole.
      - name: Archive the source for Homebrew
        run: |
          mkdir src-dist
          git archive --prefix="pcode-${GITHUB_REF_NAME#v}/" \
            -o "src-dist/pcode-${GITHUB_REF_NAME#v}-src.tar.gz" "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: src-dist
          path: src-dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/pcode
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Lets "Re-run all jobs" get past files an earlier attempt uploaded.
          skip-existing: true

  release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: src-dist
          path: src-dist/
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" \
              --title "pcode ${GITHUB_REF_NAME#v}" --generate-notes \
              $(echo "$GITHUB_REF_NAME" | grep -qE '^v[0-9]+(\.[0-9]+)*$' || echo --prerelease)
          # Separate from create so a re-run fills in an asset a failed attempt
          # missed; --clobber replaces it with this run's identical archive.
          gh release upload "$GITHUB_REF_NAME" src-dist/* -R "$GITHUB_REPOSITORY" --clobber

  homebrew:
    # The formula must not point at the asset before the release holds it.
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: master
      - uses: actions/download-artifact@v4
        with:
          name: src-dist
          path: src-dist/
      - name: Point the formula at this release
        run: |
          # Pre-releases (v0.2.0rc1) stay off the stable formula.
          echo "$GITHUB_REF_NAME" | grep -qE '^v[0-9]+(\.[0-9]+)*$' || exit 0
          # Hash the file the release serves, not a fresh download.
          sha256=$(sha256sum src-dist/*-src.tar.gz | cut -d' ' -f1)
          python3 scripts/bump_formula.py "$GITHUB_REF_NAME" "$sha256"
      - name: Commit to master
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: point the Homebrew formula at $GITHUB_REF_NAME"
          # master may move while this runs; replay the one-line change on it.
          for attempt in 1 2 3; do
            git push origin HEAD:master && exit 0
            git pull --rebase origin master
          done
          exit 1
