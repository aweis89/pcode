name: docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Build-only: strict mode fails on broken page and anchor links. Publishing to
# GitHub Pages is not possible while the repository is private on the current
# plan; to publish once it is, enable Pages with "GitHub Actions" as the
# source and add an actions/upload-pages-artifact + actions/deploy-pages job.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --only-group docs zensical build --strict
