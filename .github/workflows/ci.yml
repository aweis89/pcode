name: ci

# Lint plus the fast suite on every push and pull request. The real-tmux
# regressions (make test-tmux) and the socket-transport rerun stay local:
# they are most of the wall clock and need a real terminal setup.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        # 3.14 is what Homebrew installs on; 3.15 is what pip users on the
        # newest Python get, and the lock resolves some packages per version.
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      # Tests make real commits in scratch repos. Config, not GIT_AUTHOR_*
      # env vars: those would override the `git -c user.email=...` some
      # tests use to commit as someone else.
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: uv run --locked pytest -n auto
