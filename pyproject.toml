[project]
name = "pcode"
version = "0.1.0"
description = "A terminal coding agent built on Pydantic AI Harness"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aaron Weisberg" }]
keywords = ["pydantic-ai", "coding-agent", "terminal", "llm", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
requires-python = ">=3.11"
dependencies = [
    "filelock>=3.16,<4",
    "genai-prices>=0.1.7,<0.2",
    "httpx2>=2.13,<3",
    # Exact: pcode relies on prompt_toolkit internals, and point releases
    # change them. Bump on purpose after tests/test_prompt_toolkit_internals.py
    # and make test-all pass on the new version.
    "prompt-toolkit==3.0.53",
    "psutil>=6,<8",
    "yappi>=1.7.6,<2",
    # playwright backs the bundled browser extension (/browser on); Chromium
    # itself is downloaded on first use, not at install.
    # Harness ships from the pydantic-ai repo with every Pydantic AI release and
    # pins pydantic-ai-slim to the same minor; bump both together.
    "pydantic-ai-harness[exa,coder,codemode,playwright]>=0.52.0,<0.53",
    # duckduckgo and web-fetch back the bundled web_research extension when no
    # provider-native search or Exa key is available.
    # google covers both google and google-cloud providers; bedrock pulls boto3.
    "pydantic-ai-slim[anthropic,bedrock,duckduckgo,google,groq,mcp,openai,web-fetch,xai]>=2.52.0,<3",
    "rich>=14,<15",
    # FastMCP 4.x OAuth callback server selects Uvicorn's websockets-sansio protocol.
    "websockets>=15.0.1,<17",
]

[project.optional-dependencies]
# claude: models. Optional because each wheel bundles the Claude Code CLI
# (about 95 MB to download, 215 MB installed); the sdist would run whatever
# `claude` is on PATH instead of the CLI version pcode was verified against.
claude = [
    "claude-agent-sdk>=0.2.160,<0.3",
]

[project.urls]
Homepage = "https://github.com/aweis89/pcode"
Documentation = "https://aweis89.github.io/pcode/"
Source = "https://github.com/aweis89/pcode"
Issues = "https://github.com/aweis89/pcode/issues"

[project.scripts]
pcode = "pcode.cli:main"
pcode-benchmark = "pcode.profile_benchmark:main"

[build-system]
# 1.27 is the first to accept an SPDX `license` string with `license-files`.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# An explicit list: hatch otherwise ships every non-ignored file, including
# local scratch under tmp/ and agent config. Tests stay out: they read docs/,
# dev/, scripts/ and .githooks/ and expect a git checkout.
include = ["/src", "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pcode[claude]",
    "pytest>=8",
    "pexpect>=4.9; sys_platform != 'win32'",
    "ruff>=0.11",
    "pytest-xdist>=3.6",
]
docs = [
    "zensical>=0.0.63",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["tmux: real-tmux layout regression (slow; opt in with --tmux)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
