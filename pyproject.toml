[project]
name = "pcode"
version = "0.1.0"
description = "A streaming terminal for Pydantic AI"
requires-python = ">=3.11"
dependencies = [
    "filelock>=3.16,<4",
    "httpx2>=2.13,<3",
    "prompt-toolkit>=3.0.52,<4",
    "pydantic-ai-harness[exa]>=0.31.0,<0.32",
    "pydantic-ai-slim[anthropic,mcp,openai]>=2.43.0,<3",
    "rich>=14,<15",
    # FastMCP 4.x OAuth callback server selects Uvicorn's websockets-sansio protocol.
    "websockets>=15.0.1,<17",
]

[project.scripts]
pcode = "pcode.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pexpect>=4.9; sys_platform != 'win32'", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
