[project]
name = "pcode"
version = "0.1.0"
description = "A scrollback-native terminal UI preview"
requires-python = ">=3.11"
dependencies = [
    "prompt-toolkit>=3.0.52,<4",
    "rich>=14,<15",
]

[project.scripts]
pcode = "pcode.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pexpect>=4.9; sys_platform != 'win32'", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
