[project]
name = "pcode"
version = "0.1.0"
description = "A streaming terminal for Pydantic AI"
requires-python = ">=3.11"
dependencies = [
    "filelock>=3.16,<4",
    "genai-prices>=0.1.7,<0.2",
    "httpx2>=2.13,<3",
    "prompt-toolkit>=3.0.52,<4",
    "psutil>=6,<8",
    "yappi>=1.7.6,<2",
    "pydantic-ai-harness[exa,coder] @ git+https://github.com/pydantic/pydantic-ai-harness.git@12bce878da99bca61a5d8d798bff0a3bc93bd153",
    "pydantic-ai-slim[anthropic,mcp,openai]>=2.44.0,<3",
    "rich>=14,<15",
    # FastMCP 4.x OAuth callback server selects Uvicorn's websockets-sansio protocol.
    "websockets>=15.0.1,<17",
]

[project.scripts]
pcode = "pcode.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = ["pytest>=8", "pexpect>=4.9; sys_platform != 'win32'", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
